spring.application.name=ma-vie-simplifiee
server.port=${PORT:8080}

# ===== Base de données PostgreSQL (Neon, Supabase, Render…) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vie}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Toutes les tables sont préfixées « vie_simplifiee_ » : la base peut être partagée avec d'autres projets
spring.jpa.hibernate.naming.physical-strategy=app.vie.config.PrefixNamingStrategy
spring.jackson.time-zone=Europe/Luxembourg
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT : secret d'au moins 32 caractères =====
app.jwt.secret=${JWT_SECRET:CHANGE_ME_with_a_very_long_random_secret_key_32chars_min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ===== CORS (adresses du front, séparées par des virgules) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health

# ===== Import de factures par IA : Ollama (modèle gratuit, local ou sur votre serveur) =====
app.ai.url=${OLLAMA_URL:http://localhost:11434}
app.ai.model=${OLLAMA_MODEL:gemma3:4b}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# ===== E-mails : en local, Mailpit (http://localhost:8025) reçoit tous les messages, gratuitement =====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
management.health.mail.enabled=false
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:Ma Vie Simplifiée <no-reply@vie-simplifiee.local>}
# Résumé quotidien à 8 h (factures proches, rendez-vous, tâches, documents) : désactivé par défaut
app.mail.digest=${MAIL_DIGEST:false}
