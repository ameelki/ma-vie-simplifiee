spring.application.name=ma-vie-simplifiee
server.port=${PORT:8080}

# ===== Base de données PostgreSQL (Neon, Supabase, Render…) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vie}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Toutes les tables sont préfixées « vie_simplifiee_ » : la base peut être partagée avec d'autres projets
spring.jpa.hibernate.naming.physical-strategy=app.vie.config.PrefixNamingStrategy
spring.jackson.time-zone=Europe/Luxembourg
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT : secret d'au moins 32 caractères =====
app.jwt.secret=${JWT_SECRET:CHANGE_ME_with_a_very_long_random_secret_key_32chars_min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ===== CORS (adresses du front, séparées par des virgules) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

management.endpoints.web.exposure.include=health

# ===== Import de factures par IA : Ollama (modèle gratuit, local ou sur votre serveur) =====
app.ai.url=${OLLAMA_URL:http://localhost:11434}
app.ai.model=${OLLAMA_MODEL:gemma3:4b}
# Interrupteur général des fonctions IA (import de factures, de prospectus, mise à jour auto des promos) : désactivé par défaut
app.ai.enabled=${AI_ENABLED:false}
# Ou une API gratuite compatible OpenAI (Gemini, Groq, OpenRouter…) : renseigner AI_API_KEY et AI_MODEL (elle remplace alors Ollama)
app.ai.api-url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/openai}
app.ai.api-key=${AI_API_KEY:}
app.ai.api-model=${AI_MODEL:}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# ===== Promos des supermarchés (partagées par tous les utilisateurs) =====
# Qui peut publier les prospectus (e-mails séparés par des virgules) ; les autres utilisateurs ne font que consulter
app.promo.admins=${PROMO_ADMINS:melkiaymen151997@gmail.com}
# Import automatique chaque lundi à 7 h (Ollama requis) : Magasin|URL du prospectus PDF ou image;Magasin|URL...
app.promo.feeds=${PROMO_FEEDS:}

# ===== Administration : e-mails autorisés à voir les utilisateurs actifs (séparés par des virgules) =====
app.admin.emails=${APP_ADMINS:melkiaymen151997@gmail.com}
