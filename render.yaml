# Déploiement du back-end sur Render (Blueprint). La base PostgreSQL est à créer chez Neon / Supabase / Render.
services:
  - type: web
    name: ma-vie-simplifiee-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL          # ex : jdbc:postgresql://HOTE/NOM_BASE?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET      # 32 caractères minimum
        generateValue: true
      # Fonctions IA désactivées par défaut. Pour les activer : AI_ENABLED=true + AI_API_KEY + AI_MODEL (voir README)
      - key: CORS_ORIGINS    # URL du front (facultatif pour *.netlify.app)
        sync: false
