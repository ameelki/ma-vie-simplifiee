# Déploiement du back-end sur Render (Blueprint). La base PostgreSQL est à créer chez Neon / Supabase / Render.
services:
  - type: web
    name: ma-vie-simplifiee-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL          # ex : jdbc:postgresql://HOTE/NOM_BASE?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET      # 32 caractères minimum
        generateValue: true
      - key: AI_API_KEY          # facultatif : clé d une API d IA gratuite (Gemini, Groq…) pour l import par IA
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_URL
        sync: false
      - key: OLLAMA_URL          # facultatif : adresse d un serveur Ollama (à la place de l API)
        sync: false
      - key: CORS_ORIGINS    # URL du front (facultatif pour *.netlify.app)
        sync: false
